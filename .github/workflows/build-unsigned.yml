name: Build unsigned Odyssey IPA
on:
  push:
    branches: [build/unsigned-ipa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare Xcode and legacy iOS 13 toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          git clone --no-checkout https://github.com/nahtedetihw/Xcode11Toolchain.git "$RUNNER_TEMP/legacy-source"
          git -C "$RUNNER_TEMP/legacy-source" checkout f20b1422fe2733e7658632a037959d2c3766b257
          mkdir -p "$HOME/Library/Developer/Toolchains"
          mv "$RUNNER_TEMP/legacy-source/XcodeDefault.xctoolchain" "$HOME/Library/Developer/Toolchains/OdysseyLegacy.xctoolchain"
          /usr/libexec/PlistBuddy -c 'Set :Identifier org.odyssey.legacy' "$HOME/Library/Developer/Toolchains/OdysseyLegacy.xctoolchain/ToolchainInfo.plist"
          export TOOLCHAINS=org.odyssey.legacy
          xcrun --find swiftc
          xcrun swiftc --version
          xcrun clang --version
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/iPhoneOS13.7.sdk.tar.xz" https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS13.7.sdk.tar.xz
          tar -xf "$RUNNER_TEMP/iPhoneOS13.7.sdk.tar.xz" -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/iPhoneOS13.7.sdk/SDKSettings.plist"
          sudo cp -R "$RUNNER_TEMP/iPhoneOS13.7.sdk" /Applications/Xcode_16.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS13.7.sdk
          sudo /usr/libexec/PlistBuddy -c 'Set :MinimumSDKVersion 13.7' /Applications/Xcode_16.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Info.plist
          sudo mv /Applications/Xcode_16.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk "$RUNNER_TEMP/iPhoneOS18.5.sdk.disabled"
          sudo ln -sfn iPhoneOS13.7.sdk /Applications/Xcode_16.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk
          xcodebuild -showsdks | tee "$RUNNER_TEMP/sdks.txt"
          grep -q iphoneos13.7 "$RUNNER_TEMP/sdks.txt"
          ln -s "$GITHUB_WORKSPACE/Deps/SwiftZSTD" "$GITHUB_WORKSPACE/../SwiftZSTD"
      - name: Build unsigned IPA
        env:
          TOOLCHAINS: org.odyssey.legacy
        run: |
          set -euo pipefail
          export SWIFT_INCLUDE_PATHS="$HOME/Library/Developer/Toolchains/OdysseyLegacy.xctoolchain/usr/lib/swift/iphoneos/prebuilt-modules"
          xcodebuild clean build -toolchain org.odyssey.legacy CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO "ARCHS=arm64 arm64e" PRODUCT_BUNDLE_IDENTIFIER=org.coolstar.odyssey -sdk iphoneos13.7 SDKROOT=iphoneos13.7 "OTHER_SWIFT_FLAGS=-I $SWIFT_INCLUDE_PATHS" -scheme Odyssey -configuration Release -derivedDataPath build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Odyssey.app Payload/
          rm -rf Payload/Odyssey.app/Frameworks
          zip -r9 Odyssey.ipa Payload/Odyssey.app
      - name: Verify package
        run: |
          set -euo pipefail
          unzip -t Odyssey.ipa
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/Odyssey.app/Info.plist)" = 13.0
          lipo -info Payload/Odyssey.app/Odyssey
          lipo -verify_arch arm64 arm64e Payload/Odyssey.app/Odyssey
          otool -arch arm64e -hv Payload/Odyssey.app/Odyssey
          mkdir helper-check
          tar -xf Payload/Odyssey.app/basebinaries.tar -C helper-check amfidebilitate
          lipo -detailed_info helper-check/amfidebilitate
          otool -arch arm64e -hv helper-check/amfidebilitate
          if codesign -dv Payload/Odyssey.app 2>&1; then exit 1; fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Odyssey.app/Info.plist
          shasum -a 1 Odyssey.ipa | tee Odyssey.ipa.sha1
      - uses: actions/upload-artifact@v4
        with:
          name: Odyssey-unsigned-iOS13
          path: |
            Odyssey.ipa
            Odyssey.ipa.sha1
          if-no-files-found: error
          retention-days: 30