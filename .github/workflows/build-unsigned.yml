name: Build unsigned Odyssey IPA
on:
  push:
    branches: [build/unsigned-ipa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
      - name: Prepare dependency
        run: |
          ln -s "$GITHUB_WORKSPACE/Deps/SwiftZSTD" "$GITHUB_WORKSPACE/../SwiftZSTD"
      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          color = Path("Odyssey/Alderis/ColorPickerInnerViewController.swift")
          text = color.read_text()
          assert text.count("var tab: ColorPickerTab {") == 1
          color.write_text(text.replace("var tab: ColorPickerTab {", "var selectedColorTab: ColorPickerTab {"))

          exploit = Path("Odyssey/exploit/ios13_userspace.c")
          text = exploit.read_text()
          marker = "#include <xpc/xpc.h>"
          assert text.count(marker) == 1
          assert text.count("xpc_connection_create_mach_service(") == 3
          text = text.replace("xpc_connection_create_mach_service(", "odyssey_xpc_mach_service(")
          text = text.replace(
              marker,
              marker
              + "\n#ifndef TASK_SEATBELT_PORT\n#define TASK_SEATBELT_PORT 7\n#endif\n"
              + 'extern xpc_connection_t odyssey_xpc_mach_service(const char *, dispatch_queue_t, uint64_t) __asm__("_xpc_connection_create_mach_service");',
          )
          exploit.write_text(text)
          PY
          xcodebuild clean build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            PRODUCT_BUNDLE_IDENTIFIER=org.coolstar.odyssey \
            -sdk iphoneos -scheme Odyssey -configuration Release -derivedDataPath build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Odyssey.app Payload/
          rm -rf Payload/Odyssey.app/Frameworks
          zip -r9 Odyssey.ipa Payload/Odyssey.app
      - name: Verify package
        run: |
          set -euo pipefail
          unzip -t Odyssey.ipa > /dev/null
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/Odyssey.app/Info.plist)
          echo "MinimumOSVersion=$MIN_OS"
          test "$MIN_OS" = "13.0"
          lipo -info Payload/Odyssey.app/Odyssey
          lipo -verify_arch arm64 Payload/Odyssey.app/Odyssey
          mkdir -p helper-check
          tar -xf Payload/Odyssey.app/basebinaries.tar -C helper-check amfidebilitate
          lipo -detailed_info helper-check/amfidebilitate | grep -E 'architecture |cpusubtype '
          if codesign -dv Payload/Odyssey.app > /dev/null 2>&1; then
            echo "app bundle unexpectedly signed"
            exit 1
          fi
          echo "app bundle is unsigned"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Odyssey.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/Odyssey.app/Info.plist
          shasum -a 1 Odyssey.ipa | tee Odyssey.ipa.sha1
      - uses: actions/upload-artifact@v4
        with:
          name: Odyssey-unsigned-iOS13-arm64
          path: |
            Odyssey.ipa
            Odyssey.ipa.sha1
          if-no-files-found: error
          retention-days: 30
