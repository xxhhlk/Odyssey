name: Build unsigned Odyssey IPA
on:
  push:
    branches: [build/unsigned-ipa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
      - name: Prepare dependency
        run: |
          ln -s "$GITHUB_WORKSPACE/Deps/SwiftZSTD" "$GITHUB_WORKSPACE/../SwiftZSTD"
          file amfidebilitate/ldid
          chmod +x amfidebilitate/ldid
      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("Odyssey/Alderis/ColorPickerInnerViewController.swift"); s=p.read_text(); assert s.count("var tab: ColorPickerTab {") == 1; p.write_text(s.replace("var tab: ColorPickerTab {", "var selectedColorTab: ColorPickerTab {"))'
          xcodebuild clean build CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO ARCHS=arm64 PRODUCT_BUNDLE_IDENTIFIER=org.coolstar.odyssey -sdk iphoneos -scheme Odyssey -configuration Release -derivedDataPath build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Odyssey.app Payload/
          rm -rf Payload/Odyssey.app/Frameworks
          zip -r9 Odyssey.ipa Payload/Odyssey.app
      - name: Verify package
        run: |
          set -euo pipefail
          unzip -t Odyssey.ipa
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/Odyssey.app/Info.plist | tee minimum-os.txt
          test "$(cat minimum-os.txt)" = "13.0"
          lipo -info Payload/Odyssey.app/Odyssey
          tar -xf Payload/Odyssey.app/basebinaries.tar amfidebilitate
          lipo -detailed_info amfidebilitate
          otool -arch arm64e -hv amfidebilitate
          codesign -dv Payload/Odyssey.app 2>&1 && exit 1 || test $? -eq 1
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Odyssey.app/Info.plist
          shasum -a 1 Odyssey.ipa | tee Odyssey.ipa.sha1
      - uses: actions/upload-artifact@v4
        with:
          name: Odyssey-unsigned-iOS13
          path: |
            Odyssey.ipa
            Odyssey.ipa.sha1
          if-no-files-found: error
          retention-days: 30