name: Build unsigned Odyssey IPA
on:
  push:
    branches: [build/unsigned-ipa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare legacy iOS 13 toolchain and SDK
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

          git clone --quiet https://github.com/nahtedetihw/Xcode11Toolchain.git "$RUNNER_TEMP/legacy-source"
          git -C "$RUNNER_TEMP/legacy-source" checkout --quiet f20b1422fe2733e7658632a037959d2c3766b257

          TC="$HOME/Library/Developer/Toolchains/OdysseyLegacy.xctoolchain"
          mkdir -p "$(dirname "$TC")"
          mv "$RUNNER_TEMP/legacy-source/XcodeDefault.xctoolchain" "$TC"

          SWIFT_LIB="$TC/usr/lib/swift/iphoneos"
          for f in "$SWIFT_LIB/prebuilt-modules"/*; do
            ln -sfn "$f" "$SWIFT_LIB/$(basename "$f")"
          done
          for f in "$TC/usr/lib/swift-5.0/iphoneos"/*; do
            [ -e "$SWIFT_LIB/$(basename "$f")" ] || ln -sfn "$f" "$SWIFT_LIB/$(basename "$f")"
          done

          curl -fsSL --retry 3 -o "$RUNNER_TEMP/iPhoneOS13.7.sdk.tar.xz" https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS13.7.sdk.tar.xz
          tar -xf "$RUNNER_TEMP/iPhoneOS13.7.sdk.tar.xz" -C "$RUNNER_TEMP"

          SDK_DIR="/Applications/Xcode_16.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs"
          sudo mv "$SDK_DIR/iPhoneOS.sdk" "$RUNNER_TEMP/iPhoneOS18.sdk"
          sudo cp -R "$RUNNER_TEMP/iPhoneOS13.7.sdk" "$SDK_DIR/iPhoneOS13.7.sdk"
          sudo ln -sfn iPhoneOS13.7.sdk "$SDK_DIR/iPhoneOS.sdk"
          sudo /usr/libexec/PlistBuddy -c 'Set :MinimumSDKVersion 13.7' /Applications/Xcode_16.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Info.plist
          xcodebuild -showsdks | tee "$RUNNER_TEMP/sdks.txt"
          grep -q 'iphoneos13.7' "$RUNNER_TEMP/sdks.txt"

          ln -s "$GITHUB_WORKSPACE/Deps/SwiftZSTD" "$GITHUB_WORKSPACE/../SwiftZSTD"
      - name: Filter flags unsupported by Swift 5.2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib

          template = '''#!/bin/bash
          out=()
          skip=0
          for a in "$@"; do
            if [ "$skip" = 1 ]; then skip=0; continue; fi
            case "$a" in
              -enable-experimental-feature|-enable-upcoming-feature|-package-name|-emit-const-values-path|-const-gather-protocols-file) skip=1; continue;;
              -enable-bare-slash-regex|-emit-const-values|-no-emit-module-separately-wmo|-explicit-module-build) continue;;
            esac
            out+=("$a")
          done
          exec -a "$0" "__REAL__" "${out[@]}"
          '''

          tc = pathlib.Path(os.environ["HOME"]) / "Library/Developer/Toolchains/OdysseyLegacy.xctoolchain/usr/bin"
          for name in ("swiftc", "swift-frontend"):
              target = tc / name
              real = tc / (name + ".real")
              if not target.exists() or real.exists():
                  continue
              os.rename(target, real)
              target.write_text(template.replace("__REAL__", str(real)))
              target.chmod(0o755)
          print("wrapped:", sorted(p.name for p in tc.glob("*.real")))
          PY
      - name: Diagnose legacy Swift toolchain
        run: |
          TC="$HOME/Library/Developer/Toolchains/OdysseyLegacy.xctoolchain"
          SDK="/Applications/Xcode_16.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS13.7.sdk"
          echo "== compiler =="
          "$TC/usr/bin/swiftc" --version || true
          echo "== stdlib =="
          ls "$TC/usr/lib/swift/iphoneos/Swift.swiftmodule" 2>&1 || true
          echo "== minimal arm64e compile =="
          printf 'print("hi")\n' > "$RUNNER_TEMP/t.swift"
          "$TC/usr/bin/swiftc" -target arm64e-apple-ios13.0 -sdk "$SDK" -c "$RUNNER_TEMP/t.swift" -o "$RUNNER_TEMP/t.o" -v 2>&1 | tail -15 || true
          echo "== minimal arm64 compile =="
          "$TC/usr/bin/swiftc" -target arm64-apple-ios13.0 -sdk "$SDK" -c "$RUNNER_TEMP/t.swift" -o "$RUNNER_TEMP/t2.o" 2>&1 | tail -5 || true
      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          TC="$HOME/Library/Developer/Toolchains/OdysseyLegacy.xctoolchain"
          xcodebuild clean build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            ONLY_ACTIVE_ARCH=NO \
            "ARCHS=arm64 arm64e" \
            PRODUCT_BUNDLE_IDENTIFIER=org.coolstar.odyssey \
            SDKROOT=iphoneos13.7 \
            SWIFT_EXEC="$TC/usr/bin/swiftc" \
            CC="$TC/usr/bin/clang" \
            CXX="$TC/usr/bin/clang++" \
            LD="$TC/usr/bin/ld" \
            AR="$TC/usr/bin/ar" \
            LIBTOOL="$TC/usr/bin/libtool" \
            STRIP="$TC/usr/bin/strip" \
            -scheme Odyssey -configuration Release -derivedDataPath build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Odyssey.app Payload/
          rm -rf Payload/Odyssey.app/Frameworks
          zip -r9 Odyssey.ipa Payload/Odyssey.app
      - name: Verify package
        run: |
          set -euo pipefail
          unzip -t Odyssey.ipa > /dev/null
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/Odyssey.app/Info.plist)
          echo "MinimumOSVersion=$MIN_OS"
          test "$MIN_OS" = "13.0"
          lipo -verify_arch arm64 arm64e Payload/Odyssey.app/Odyssey
          lipo -detailed_info Payload/Odyssey.app/Odyssey | grep -E 'architecture |cpusubtype '
          lipo -detailed_info Payload/Odyssey.app/Odyssey | grep -E 'cpusubtype +2$'
          if lipo -detailed_info Payload/Odyssey.app/Odyssey | grep -q 'cpusubtype +2147483650'; then
            echo "arm64e slice uses the post-iOS 14 ABI"
            exit 1
          fi
          otool -arch arm64e -l Payload/Odyssey.app/Odyssey | grep -A4 LC_BUILD_VERSION | head -20
          mkdir -p helper-check
          tar -xf Payload/Odyssey.app/basebinaries.tar -C helper-check amfidebilitate
          lipo -detailed_info helper-check/amfidebilitate | grep -E 'architecture |cpusubtype '
          if codesign -dv Payload/Odyssey.app > /dev/null 2>&1; then
            echo "app bundle unexpectedly signed"
            exit 1
          fi
          echo "app bundle is unsigned"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Odyssey.app/Info.plist
          shasum -a 1 Odyssey.ipa | tee Odyssey.ipa.sha1
      - uses: actions/upload-artifact@v4
        with:
          name: Odyssey-unsigned-iOS13
          path: |
            Odyssey.ipa
            Odyssey.ipa.sha1
          if-no-files-found: error
          retention-days: 30
